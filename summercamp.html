<!DOCTYPE html>
<html>
  <head>
    <title>Summer Camp Maze</title>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-135113520-1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'UA-135113520-1');
    </script>
    <link rel="stylesheet" href="https://cdn.pixelplush.dev/maze/web/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/tinycolor2/dist/tinycolor-min.js"></script>
    <script src="https://cdn.pixelplush.dev/assets/pinkfluffyunicorn.min.js"></script>
    <style>
      * {
        background-color: transparent;
        margin: 0;
        padding: 0;
        border: 0;
      }
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="unicorn-display"></div>
    <script src="https://cdn.pixelplush.dev/maze/web/game.min.js"></script>
    <script>
      const params = new URLSearchParams( location.search );
      setupGame( "Summer Camp Maze", {
        requires: "addon_maze_summercamp",
        path: "https://cdn.pixelplush.dev",
        map: "game-maze/summercamp/floor",
        walls: "game-maze/summercamp/walls1",
        fog: [],
        banner: "game-maze/summercamp/banner",
        instructions: "game-maze/summercamp/camp_instructions",
        numbers: "game-maze/summercamp/numbers",
        endBG: "game-maze/summercamp/camp_maze_bcg",
        endNote: "game-maze/summercamp/end_banner",
        scoreBoard: [ "game-maze/summercamp/camp_scoreboard" ],
        scoreBoardVerticalOffset: 50,
        scoresVerticalOffset: -20,
        instructionsVerticalOffset: -20,
        bannerHorizontalOffset: -10,
        bannerVerticalOffset: -40,
        endVerticalOffset: 120,
        characters: {
          "boyhunter": "boyhunter",
          "girlhunter": "girlhunter",
          "evilbear": "evilbear",
          "maaya": "maaya",
          "instafluff": "instafluff",
        },
        playable: [ "boyhunter", "girlhunter" ],
        itemPaths: {
          "summercamp_ladybug": "game-maze/summercamp/ladybug",
          "summercamp_leaf": "game-maze/summercamp/leaf",
          "summercamp_feather": "game-maze/summercamp/feather",
          "summercamp_strawberry": "game-maze/summercamp/strawberry",
          "summercamp_stick": "game-maze/summercamp/stick",
          "summercamp_stone": "game-maze/summercamp/stone",
        },
        animatedPrizes: {
        },
        prizes: {
          "summercamp_ladybug": 5,
          "summercamp_leaf": 10,
          "summercamp_feather": 25,
          "summercamp_strawberry": 50,
        },
        prizeRarity: {
          "summercamp_ladybug": 50,
          "summercamp_leaf": 30,
          "summercamp_feather": 10,
          "summercamp_strawberry": 5,
        },
        traps: {
          "summercamp_stick": -5,
          "summercamp_stone": -5,
        },
        trapRarity: {
          "summercamp_stick": 30,
          "summercamp_stone": 30,
        },
        bossName: "EVIL!",
        bossCharacter: "evilbear",
        defaultNameColor: "#ffffff",
        scoreColor: "#1E3214",
        scoreboardColor: "#1E3214",
        snow: false,
        giftDrop: null,
        lanterns: "game-maze/summercamp/lanterns",
        glows: [
          { x: 6, y: 5 },
          { x: 634, y: 5 },
          { x: 510, y: 33 },
          { x: 320, y: 66 },
          { x: 97, y: 98 },
          { x: 543, y: 194 },
          { x: 98, y: 227 },
          { x: 415, y: 255 },
          { x: 256, y: 325 },
          { x: 5, y: 350 },
          { x: 634, y: 350 },
        ]
      },
      {
        channel: params.get( "channel" ),
        oauth: params.get( "oauth" ),
        refreshToken: params.get( "refreshToken" ),
        messageFormat: params.get( "messageFormat" ),
        addBoss: !params.get( "noBoss" ),
        bossEffect: params.get( "bossEffect" ) || "steal",
        trapEffect: params.get( "trapEffect" ) || "points",
        numBosses: params.get( "bosses" ) ? parseInt( params.get( "bosses" ) ) : 0,
        numPrizes: params.get( "prizes" ) ? parseInt( params.get( "prizes" ) ) : 14,
        numTraps: params.get( "traps" ) ? parseInt( params.get( "traps" ) ) : 5,
        showBannerAd: false,
      });
    </script>
  </body>
</html>
